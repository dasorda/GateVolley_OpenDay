<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GateVolley Scout Progressivo</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 10px; margin: 0; }
        .scout-container { max-width: 600px; margin: 0 auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Configurazione Iniziale */
        .setup-screen { background: #eceff1; padding: 20px; border-radius: 6px; margin-bottom: 15px; border: 2px dashed #b0bec5; }
        .setup-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; aspect-ratio: 4 / 3; }
        .setup-input-box { background: white; border: 1px solid #90a4ae; border-radius: 4px; display: flex; flex-direction: column; padding: 8px; justify-content: center; }
        .setup-input-box label { font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #37474f; }
        .setup-input-box input { width: 80%; margin: 0 auto; padding: 6px; text-align: center; font-size: 1.1rem; font-weight: bold; border: 1px solid #cfd8dc; border-radius: 4px; }
        .start-btn { background: #2e7d32; color: white; border: none; padding: 12px 25px; font-size: 1.1rem; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; }
        .radio-group { margin: 10px 0; padding: 10px; background: white; border-radius: 4px; border: 1px solid #cfd8dc; }

        /* Tabellone con lo sfondo originale GateVolley (Gradiente + Grid Pattern) */
        .scoreboard { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #fff; 
            padding: 15px; 
            border-radius: 6px; 
            margin-bottom: 15px; 
            border-bottom: 3px solid #3b82f6;
        }
        .team-box { flex: 1; text-align: center; padding: 5px; position: relative; }
        .team-score { font-size: 2.5rem; font-weight: bold; color: #ffeb3b; margin-top: 5px; }
        .ball-indicator { font-size: 1.2rem; visibility: hidden; display: inline-block; margin-left: 5px; vertical-align: middle; }
        .has-service { visibility: visible !important; animation: pulse 1.5s infinite; }
        .rally-id-display { font-size: 0.8rem; color: #81c784; font-family: monospace; }

        /* Campo da Gioco Posizionale */
        .volleyball-court { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #ff9800; padding: 12px; border: 3px solid #1e88e5; border-radius: 4px; margin-bottom: 15px; aspect-ratio: 4 / 3; }
        .position-btn { background: rgba(255, 255, 255, 0.95); border: 2px solid #37474f; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px; min-height: 60px; position: relative; }
        .position-label { font-size: 0.8rem; color: #546e7a; font-weight: bold; }
        .player-number-display { font-size: 1.6rem; font-weight: bold; color: #1e88e5; }
        .server-highlight { border: 3px dashed #1b5e20 !important; background: #e8f5e9 !important; }
        
        /* Sezioni Pulsanti */
        .panel { margin: 10px 0; display: flex; justify-content: space-around; gap: 5px; }
        .panel button { flex: 1; padding: 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-weight: bold;}
        .btn-skill { background: #e0e0e0; }
        
        /* Tastiera dei Voti Dinamici */
        .vote-keyboard { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 15px 0; }
        .vote-btn { padding: 15px 5px; font-size: 1.1rem; font-weight: bold; border: 2px solid #78909c; border-radius: 6px; cursor: pointer; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .v-double-plus { background: #1b5e20; } 
        .v-plus { background: #4caf50; }        
        .v-excl { background: #ff9800; }        
        .v-minus { background: #e53935; }       
        .v-error { background: #b71c1c; }       

        /* Stati Selezionati */
        .selected { background: #1e88e5 !important; color: white !important; }
        .selected .position-label { color: #bbdefb !important; }
        .selected .player-number-display { color: white !important; }
        
        /* Storico */
        .log-area { max-height: 140px; overflow-y: auto; text-align: left; background: #eee; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 0.85rem; margin-bottom: 10px; line-height: 1.4; }
        .export-btn { background: #1565c0; color: white; width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; font-weight: bold; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
<div class="scout-container">

    <!-- CONFIGURAZIONE INIZIALE -->
    <div id="setup-panel" class="setup-screen">
        <h3>📋 Configurazione Formazione Iniziale</h3>
        <div class="setup-grid">
            <div class="setup-input-box"><label>P4 (Avanti-Sx)</label><input type="number" id="input-p4" placeholder="N°"></div>
            <div class="setup-input-box"><label>P3 (Avanti-Cc)</label><input type="number" id="input-p3" placeholder="N°"></div>
            <div class="setup-input-box"><label>P2 (Avanti-Dx)</label><input type="number" id="input-p2" placeholder="N°"></div>
            <div class="setup-input-box"><label>P5 (Dietro-Sx)</label><input type="number" id="input-p5" placeholder="N°"></div>
            <div class="setup-input-box"><label>P6 (Dietro-Cc)</label><input type="number" id="input-p6" placeholder="N°"></div>
            <div class="setup-input-box"><label>P1 (Dietro-Dx)</label><input type="number" id="input-p1" placeholder="N°"></div>
        </div>
        
        <div class="radio-group">
            <strong>Chi serve per primo nel 1° Set?</strong><br><br>
            <label><input type="radio" name="first-service" value="home" checked> NOI</label> &nbsp;&nbsp;&nbsp;&nbsp;
            <label><input type="radio" name="first-service" value="away"> AVVERSARI</label>
        </div>
        <button class="start-btn" onclick="confirmFormation()">✅ Inizia Partita</button>
    </div>

    <!-- PANNELLO DI GIOCO -->
    <div id="scout-game-panel" style="display: none;">
        <div class="scoreboard">
            <div class="team-box">
                <div>NOI <span id="ball-home" class="ball-indicator">🏐</span></div>
                <div class="team-score" id="score-home">0</div>
                <div style="font-size:0.8rem; color:#cbd5e1;">Set vinti: <span id="sets-home">0</span></div>
            </div>
            <div style="padding: 0 10px;">
                <div style="font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; color: #3b82f6;">GateVolley</div>
                <div style="font-size: 0.75rem; color: #94a3b8; font-weight: bold; margin-top: 2px;">SET <span id="current-set-display">1</span></div>
                <div class="rally-id-display" id="rally-id-display" style="margin-top: 4px;">RALLY: #1</div>
            </div>
            <div class="team-box">
                <div>AVVERSARI <span id="ball-away" class="ball-indicator">🏐</span></div>
                <div class="team-score" id="score-away">0</div>
                <div style="font-size:0.8rem; color:#cbd5e1;">Set vinti: <span id="sets-away">0</span></div>
            </div>
        </div>

        <div class="volleyball-court">
            <button class="position-btn" id="court-p4" onclick="selectCourtPosition(4)"><span class="position-label">P4</span><span class="player-number-display" id="num-p4">-</span></button>
            <button class="position-btn" id="court-p3" onclick="selectCourtPosition(3)"><span class="position-label">P3</span><span class="player-number-display" id="num-p3">-</span></button>
            <button class="position-btn" id="court-p2" onclick="selectCourtPosition(2)"><span class="position-label">P2</span><span class="player-number-display" id="num-p2">-</span></button>
            <button class="position-btn" id="court-p5" onclick="selectCourtPosition(5)"><span class="position-label">P5</span><span class="player-number-display" id="num-p5">-</span></button>
            <button class="position-btn" id="court-p6" onclick="selectCourtPosition(6)"><span class="position-label">P6</span><span class="player-number-display" id="num-p6">-</span></button>
            <button class="position-btn" id="court-p1" onclick="selectCourtPosition(1)"><span class="position-label">P1</span><span class="player-number-display" id="num-p1">-</span></button>
        </div>

        <div class="panel">
            <button class="btn-skill" id="skill-S" onclick="selectSkill('S', 'Battuta')">Battuta</button>
            <button class="btn-skill" id="skill-R" onclick="selectSkill('R', 'Ricezione')">Ricezione</button>
            <button class="btn-skill" id="skill-A" onclick="selectSkill('A', 'Attacco')">Attacco</button>
            <button class="btn-skill" id="skill-B" onclick="selectSkill('B', 'Muro')">Muro</button>
        </div>

        <h4 style="margin: 10px 0 5px 0; text-align: left; color: #555;">Valutazione Tocco:</h4>
        <div class="vote-keyboard" id="vote-keyboard-panel">
            <button class="vote-btn v-double-plus" id="vbtn-1" onclick="pressVote('#')">#</button>
            <button class="vote-btn v-plus"        id="vbtn-2" onclick="pressVote('+')">+</button>
            <button class="vote-btn v-excl"        id="vbtn-3" onclick="pressVote('!')">!</button>
            <button class="vote-btn v-minus"       id="vbtn-4" onclick="pressVote('-')">-</button>
            <button class="vote-btn v-error"       id="vbtn-5" onclick="pressVote('=')">=</button>
        </div>

        <div class="log-area" id="log-list">Nessuna azione registrata.</div>
        <button class="export-btn" onclick="exportCSV()">📥 Esporta Report CSV (Excel)</button>
    </div>
</div>
<script>
// Configurazione iniziale e stati stabili
let formation = { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null };
let scores = { home: 0, away: 0 };
let sets = { home: 0, away: 0 };
let currentSet = 1;

// Gestione dei Rally e del Possesso Servizio ('home' o 'away')
let rallyCounter = 1;
let currentService = 'home'; 

// Stato dell'azione corrente
let currentData = { player: null, position: null, skillCode: null, skillName: null };
let matchHistory = [];

// Inizia la partita salvando formazione e primo possesso palla
function confirmFormation() {
    for (let p = 1; p <= 6; p++) {
        let val = document.getElementById('input-p' + p).value;
        if (!val) { 
            alert("⚠️ Compila tutte le posizioni prima di iniziare!"); 
            return; 
        }
        formation[p] = parseInt(val, 10);
    }

    const serviceRadio = document.querySelector('input[name="first-service"]:checked');
    currentService = serviceRadio ? serviceRadio.value : 'home';

    document.getElementById('setup-panel').style.display = 'none';
    document.getElementById('scout-game-panel').style.display = 'block';
    
    updateCourtDisplay();
    updateRallyDisplay();
}

// Aggiorna i numeri sul campo, evidenzia chi è in P1 e sposta l'icona del servizio (🏐)
function updateCourtDisplay() {
    for (let p = 1; p <= 6; p++) {
        const btn = document.getElementById('court-p' + p);
        document.getElementById('num-p' + p).innerText = formation[p];
        btn.classList.remove('server-highlight');
    }

    if (currentService === 'home') {
        document.getElementById('ball-home').classList.add('has-service');
        document.getElementById('ball-away').classList.remove('has-service');
        document.getElementById('court-p1').classList.add('server-highlight');
    } else {
        document.getElementById('ball-away').classList.add('has-service');
        document.getElementById('ball-home').classList.remove('has-service');
    }
}

// Esegue la rotazione reale in senso orario (P2 -> P1 -> P6 -> P5 -> P4 -> P3 -> P2)
function rotateTeam() {
    let t1 = formation[1];
    let t2 = formation[2];
    let t3 = formation[3];
    let t4 = formation[4];
    let t5 = formation[5];
    let t6 = formation[6];

    formation[1] = t2;
    formation[6] = t1;
    formation[5] = t6;
    formation[4] = t5;
    formation[3] = t4;
    formation[2] = t3;
}

function selectCourtPosition(posNumber) {
    document.querySelectorAll('.position-btn').forEach(btn => btn.classList.remove('selected'));
    currentData.position = posNumber;
    currentData.player = formation[posNumber];
    document.getElementById('court-p' + posNumber).classList.add('selected');
}

function selectSkill(code, name) {
    document.querySelectorAll('.btn-skill').forEach(btn => btn.classList.remove('selected'));
    currentData.skillCode = code;
    currentData.skillName = name;
    document.getElementById('skill-' + code).classList.add('selected');

    if (code === 'R') {
        document.getElementById('vbtn-1').innerText = "## (Perfetta)";
        document.getElementById('vbtn-2').innerText = "+ (Positiva)";
        document.getElementById('vbtn-3').innerText = "! (Staccata)";
        document.getElementById('vbtn-4').innerText = "- (Negativa)";
        document.getElementById('vbtn-5').innerText = "= (Errore Loro)";
    } else if (code === 'A') {
        document.getElementById('vbtn-1').innerText = "# (Punto Noi)";
        document.getElementById('vbtn-2').innerText = "+ (Positivo)";
        document.getElementById('vbtn-3').innerText = "! (Difeso)";
        document.getElementById('vbtn-4').innerText = "- (Contrattacco)";
        document.getElementById('vbtn-5').innerText = "= (Errore Fuori)";
    } else {
        document.getElementById('vbtn-1').innerText = "#";
        document.getElementById('vbtn-2').innerText = "+";
        document.getElementById('vbtn-3').innerText = "!";
        document.getElementById('vbtn-4').innerText = "-";
        document.getElementById('vbtn-5').innerText = "=";
    }
}

function pressVote(voteSymbol) {
    if (!currentData.position || !currentData.skillCode) {
        alert("⚠️ Seleziona prima il Giocatore sul campo e il Fondamentale!");
        return;
    }

    let isTerminalAction = false;
    let pointTo = null;

    if (currentData.skillCode === 'R') {
        if (voteSymbol === '=') { isTerminalAction = true; pointTo = 'away'; }
    } else if (currentData.skillCode === 'A') {
        if (voteSymbol === '#') { isTerminalAction = true; pointTo = 'home'; }
        else if (voteSymbol === '=') { isTerminalAction = true; pointTo = 'away'; }
    } else if (currentData.skillCode === 'S') {
        if (voteSymbol === '#') { isTerminalAction = true; pointTo = 'home'; }
        else if (voteSymbol === '=') { isTerminalAction = true; pointTo = 'away'; }
    } else if (currentData.skillCode === 'B') {
        if (voteSymbol === '#') { isTerminalAction = true; pointTo = 'home'; }
        else if (voteSymbol === '=') { isTerminalAction = true; pointTo = 'away'; }
    }

    let rotationHappened = false;

    if (isTerminalAction && pointTo) {
        scores[pointTo]++;

        if (pointTo === 'home' && currentService === 'away') {
            rotateTeam();
            rotationHappened = true;
        }
        
        currentService = pointTo;

        let targetPoints = (currentSet === 5) ? 15 : 25;
        if (scores[pointTo] >= targetPoints && Math.abs(scores.home - scores.away) >= 2) {
            alert("🎉 Fine Set " + currentSet + "! Vinto da: " + (pointTo === 'home' ? 'NOI' : 'AVVERSARI'));
            sets[pointTo]++;
            scores.home = 0;
            scores.away = 0;
            currentSet++;
        }
    }

    let voteText = voteSymbol;
    if (currentData.skillCode === 'R' && voteSymbol === '#') voteText = "## Perfetta";
    if (currentData.skillCode === 'A' && voteSymbol === '#') voteText = "# Vincente";
    if (voteSymbol === '=') voteText = "= Errore";

    const actionRecord = {
        RallyID: "R_" + rallyCounter,
        Orario: new Date().toLocaleTimeString(),
        Set: currentSet,
        PunteggioNoi: scores.home,
        PunteggioLoro: scores.away,
        ServizioA: currentService === 'home' ? 'Noi' : 'Loro',
        RotazioneEseguita: rotationHappened ? 'SI' : 'NO',
        Giocatore: currentData.player,
        Posizione: 'P' + currentData.position,
        Fondamentale: currentData.skillName,
        Voto: voteSymbol,
        DettaglioVoto: voteText
    };

    matchHistory.push(actionRecord);
    updateLog();

    if (isTerminalAction) {
        rallyCounter++;
    }

    document.getElementById('score-home').innerText = scores.home;
    document.getElementById('score-away').innerText = scores.away;
    document.getElementById('sets-home').innerText = sets.home;
    document.getElementById('sets-away').innerText = sets.away;
    document.getElementById('current-set-display').innerText = currentSet;
    
    updateCourtDisplay();
    updateRallyDisplay();

    document.querySelectorAll('.position-btn, .btn-skill').forEach(btn => btn.classList.remove('selected'));
    currentData = { player: null, position: null, skillCode: null, skillName: null };
}

function updateRallyDisplay() {
    document.getElementById('rally-id-display').innerText = "RALLY: #" + rallyCounter;
}

function updateLog() {
    const logList = document.getElementById('log-list');
    if (matchHistory.length === 0) {
        logList.innerHTML = "Nessuna azione registrata.";
        return;
    }
    logList.innerHTML = matchHistory.map((act) => {
        let rotString = act.RotazioneEseguita === 'SI' ? ' [🔄 Ruotato]' : '';
        return "[" + act.RallyID + " | " + act.PunteggioNoi + ":" + act.PunteggioLoro + "] " + act.Posizione + " (N°" + act.Giocatore + ") " + act.Fondamentale + " -> " + act.DettaglioVoto + rotString;
    }).reverse().join('<br>');
}

function exportCSV() {
    if (matchHistory.length === 0) {
        alert("Nessun dato da esportare!");
        return;
    }
    const headers = ["RallyID", "Orario", "Set", "PunteggioNoi", "PunteggioLoro", "ServizioA", "RotazioneEseguita", "Giocatore", "Posizione", "Fondamentale", "Voto"];
    const csvRows = [headers.join(",")];
    
    matchHistory.forEach(row => {
        const values = headers.map(header => row[header]);
        csvRows.push(values.join(","));
    });
    
    const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + csvRows.join("\n");
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "scout_partita_gatevolley.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>
</body>
</html>
